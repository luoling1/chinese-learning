<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>趣味识字乐园 - 分级阅读（1000字）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
    #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFF0F0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; z-index: 999; }
    #loading .emoji { font-size: 48px; animation: bounce 1s infinite; }
    #loading .text { margin-top: 16px; font-size: 16px; color: #666; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="emoji">📚</div>
    <div class="text">正在加载，请稍候...</div>
  </div>
  <script>
    var cdnUrl = 'https://cdn.jsdelivr.net/gh/luoling1/chinese-learning@main/app.html';
    var iframe = document.createElement('iframe');
    iframe.src = cdnUrl;
    iframe.onload = function() { document.getElementById('loading').style.display = 'none'; };
    document.body.appendChild(iframe);
    // 10秒后自动隐藏loading
    setTimeout(function() { document.getElementById('loading').style.display = 'none'; }, 10000);
  </script>
</body>
</html>
